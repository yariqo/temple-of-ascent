<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Temple of Ascent</title>
  </head>
  <body>
    <div id="scene-a" class="scene"></div>
    <div id="scene-b" class="scene"></div>
    <div id="mist"></div>

    <div id="loading">
      <div class="load-logo">Temple<small>of</small>Ascent</div>
      <div class="load-bar"><i id="load-fill"></i></div>
    </div>

    <div id="app">
      <header>
        <div class="head-left"><span id="demo-badge" hidden></span></div>
        <div class="logo" id="title">Temple<small>of</small>Ascent</div>
        <div class="head-right">
          <button class="icon-btn" id="sound-btn" aria-label="Sound"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path id="snd-waves" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9c1.3 1.6 1.3 4.4 0 6M18.5 6.5c2.8 3 2.8 8 0 11"/><path id="snd-x" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6" style="display:none"/></svg></button>
          <button class="icon-btn" id="rules-btn" aria-label="Rules">?</button>
        </div>
      </header>

      <main>
        <aside id="side">
          <div id="pyramid" aria-label="Temple">
            <div class="pyr-title" id="pyr-title">Temple</div>
            <div class="tiers" id="tiers"></div>
            <div class="pyr-info" id="pyr-info"></div>
            <div class="pyr-door" aria-hidden="true">
              <div class="door-half door-l"></div>
              <div class="door-half door-r"></div>
              <div class="door-seal">
                <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="8" fill="currentColor"/><g stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M24 6v6M24 36v6M6 24h6M36 24h6M11.3 11.3l4.2 4.2M32.5 32.5l4.2 4.2M11.3 36.7l4.2-4.2M32.5 15.5l4.2-4.2"/></g></svg>
              </div>
              <div class="door-text" id="door-text"></div>
            </div>
          </div>
          <div class="bonus-wrap" id="bonus-wrap">
            <button class="bonus-tile" id="feature-btn" aria-label="Bonus &amp; Features">
              <span class="bt-shine" aria-hidden="true"></span>
              <svg class="bt-icon" viewBox="0 0 48 48" aria-hidden="true">
                <circle cx="24" cy="17" r="7" fill="currentColor"/>
                <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
                  <path d="M24 4v3M13 8l2 2.2M35 8l-2 2.2M9 17h3M36 17h3"/>
                </g>
                <path fill="currentColor" d="M8 44h32l-3-6H11zM12 37h24l-3-6H15zM16 30h16l-2.5-5h-11z"/>
              </svg>
              <span class="bt-text"><b id="feature-label">BONUS</b><small id="feature-sub"></small></span>
            </button>
            <button class="bt-off" id="feature-pill-off" hidden aria-label="off">✕</button>
          </div>
        </aside>
        <section id="stage-wrap">
          <div id="canvas-host"></div>
          <div id="fs-counter" hidden></div>
          <div id="banner" hidden><div class="b-title"></div><div class="b-sub"></div></div>
        </section>
      </main>

      <footer>
        <div class="stats">
          <div class="stat" id="stat-balance"><span id="balance-label">Balance</span><b id="balance">–</b></div>
          <div class="stat" id="stat-bet"><span id="bet-label">Bet</span><b id="bet">–</b></div>
          <div class="stat" id="stat-win"><span id="win-label">Win</span><b id="win">–</b></div>
        </div>
        <div class="controls">
          <button class="ctl-btn round" id="bet-down" aria-label="lower bet">−</button>
          <button id="spin" aria-label="Spin"><span class="spin-ring"></span><span class="spin-arrows" aria-hidden="true"><svg viewBox="0 0 48 48"><path fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" d="M38 20a15 15 0 0 0-27-5M10 28a15 15 0 0 0 27 5"/><path fill="currentColor" d="M8 8v10h10zM40 40V30H30z"/></svg></span><span id="spin-label">SPIN</span></button>
          <button class="ctl-btn round" id="bet-up" aria-label="raise bet">+</button>
          <label class="ctl-btn turbo-btn" id="turbo-wrap" title="Turbo"><input type="checkbox" id="turbo" /><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg><span id="turbo-label">TURBO</span></label>
        </div>
      </footer>
    </div>

    <div id="overlay" hidden>
      <div class="ov-card">
        <div class="ov-kicker"></div>
        <div class="ov-title"></div>
        <div class="ov-amount"></div>
        <div class="ov-sub"></div>
        <div class="ov-hint"></div>
      </div>
    </div>

    <div id="toast" hidden></div>
    <dialog id="confirm"><p id="confirm-text"></p><div class="row"><button id="confirm-no"></button><button id="confirm-yes" class="gold"></button></div></dialog>
    <dialog id="feature-menu">
      <div class="fm-head"><h3 id="fm-title"></h3><button class="fm-close" id="fm-close" aria-label="close">✕</button></div>
      <div class="fm-section"><h4 id="fm-spins-title"></h4><div class="fm-grid two" id="fm-spins"></div></div>
      <div class="fm-section" id="fm-buy-section"><h4 id="fm-buy-title"></h4><div class="fm-grid three" id="fm-buys"></div></div>
    </dialog>
    <dialog id="rules"><div id="rules-body"></div><button id="rules-close" class="gold"></button></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
